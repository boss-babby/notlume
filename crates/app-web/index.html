<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes — Web App</title>
    <link data-trunk rel="rust" data-bin="app-web" data-wasm-opt="z" data-bindgen-target="web" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; font-family: system-ui, sans-serif; }
      @media (prefers-color-scheme: dark) { html, body { background: #191919; color: #eee; } }
      canvas { display: block; width: 100%; height: 100%; }
      #loading { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 14px; }
      #loading .bar { width: 220px; height: 4px; border-radius: 2px; background: rgba(128,128,128,.25); overflow: hidden; }
      #loading .bar i { display: block; height: 100%; width: 40%; background: #2383e2; border-radius: 2px;
                        animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #loading .bar i { animation: none; width: 100%; opacity: .6; } }
      .back { position: fixed; left: 12px; bottom: 10px; font-size: 12px; opacity: .6; }
      .back a { color: inherit; }
    </style>
  </head>
  <body>
    <canvas id="nw_canvas"></canvas>
    <div id="loading">
      <strong>📓 Notes</strong>
      <div class="bar"><i></i></div>
      <small>Loading the workspace…</small>
      <noscript>This app needs JavaScript and WebAssembly.</noscript>
    </div>
    <div class="back"><a href="/">← Website</a> · <a href="/download">Download desktop app</a></div>
  </body>
</html>
