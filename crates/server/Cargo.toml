[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "axum + sqlx backend: auth, sessions and page sync."

[dependencies]
nw-api-types = { path = "../api-types" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "trace", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate", "macros", "json"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"

[dev-dependencies]
http-body-util = "0.1"
