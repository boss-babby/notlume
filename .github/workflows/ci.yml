name: CI
on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: app_db }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy", targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libs for eframe
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgtk-3-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p app-web -p nw-ui --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/app_db
      - run: cargo bench -p nw-core --no-run

  web:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/trunk-action@v0.5.0
      - run: trunk build --release
        working-directory: crates/app-web
      - run: gzip -k -9 crates/app-web/dist/*.wasm && ls -l crates/app-web/dist
      - uses: actions/upload-artifact@v4
        with: { name: web-app, path: crates/app-web/dist }

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env: { DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/app_db" }
